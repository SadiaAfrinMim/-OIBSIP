<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>My To-Do List</h1>
            <p>Organize your daily tasks efficiently</p>
        </div>

        <div class="input-section">
            <div class="input-group">
                <input type="text" id="taskInput" class="task-input" placeholder="Enter a new task..." maxlength="200">
                <button id="addTaskBtn" class="add-btn">Add Task</button>
            </div>
        </div>

        <div class="lists-container">
            <div class="task-list-section">
                <div class="section-header">
                    <span class="section-title">Pending Tasks</span>
                    <span id="pendingCount" class="count-badge">0</span>
                </div>
                <ul id="pendingList" class="task-list"></ul>
            </div>

            <div class="task-list-section">
                <div class="section-header">
                    <span class="section-title">Completed Tasks</span>
                    <span id="completedCount" class="count-badge completed-badge">0</span>
                </div>
                <ul id="completedList" class="task-list"></ul>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
